<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Animated Scanning Line -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.5"/>
    </pattern>

    <!-- Subtle Shadows -->
    <filter id="card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.04); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(14px) scale(0.97); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.55; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanMotion {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      .orb-1 { animation: floatSlow 8s ease-in-out infinite; }
      .orb-2 { animation: floatReverse 10s ease-in-out infinite; }
      .orb-3 { animation: pulseGlow 6s ease-in-out infinite; }
      .animated-scan { animation: scanMotion 7s linear infinite; }
      .moving-flow { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
      .pill-hover { transition: transform 0.3s ease; }
      .pill-hover:hover { transform: translateY(-4px); }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>

  <!-- High-Tech Engineering Grid -->
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Animated Ambient Orbs (Background layer) -->
  <g class="orb-1">
    <circle cx="180" cy="120" r="180" fill="url(#glow-cyan)"/>
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="300" r="220" fill="url(#glow-purple)"/>
  </g>
  <g class="orb-3">
    <circle cx="600" cy="210" r="260" fill="url(#glow-pink)"/>
  </g>

  <!-- Dynamic Animated Flow Connectors (Background accent lines) -->
  <g opacity="0.4">
    <path class="moving-flow" d="M 100,100 C 300,40 500,160 700,90 S 1100,140 1150,110" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="moving-flow" d="M 50,340 C 250,380 450,290 750,360 S 1050,320 1150,350" fill="none" stroke="#a855f7" stroke-width="2" style="animation-direction: reverse;"/>
  </g>

  <!-- Dynamic Laser Scan Line across header border -->
  <g opacity="0.6">
    <line x1="0" y1="2" x2="1200" y2="2" stroke="#334155" stroke-width="2"/>
    <rect class="animated-scan" y="0" width="300" height="4" fill="url(#scan-grad)"/>
    <line x1="0" y1="418" x2="1200" y2="418" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Badge / Category Pill -->
  <g transform="translate(600, 52)">
    <rect x="-145" y="-16" width="290" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" filter="url(#card-glow)"/>
    <circle cx="-122" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-106" y="5" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE BRAND GOVERNANCE</text>
  </g>

  <!-- Foreground Main Title (Guaranteed High Contrast & Foreground Z-Index) -->
  <g transform="translate(600, 126)">
    <text text-anchor="middle" y="0" font-size="44" font-weight="900" fill="url(#text-grad)" letter-spacing="-1">
      Brand Consistency &amp; Style Governance
    </text>
  </g>

  <!-- Subtitle / Value Proposition -->
  <g transform="translate(600, 168)">
    <text text-anchor="middle" y="0" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated Standards, Modern DAM, Content Proofing &amp; AI Brand Governance
    </text>
  </g>

  <!-- Interactive / Modern Feature Architecture Cards (Lower Half) -->
  <g transform="translate(130, 215)">
    <!-- Card 1: Asset Management (DAM) -->
    <g class="pill-hover" transform="translate(0, 0)">
      <rect width="210" height="135" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#card-glow)"/>
      <circle cx="36" cy="36" r="16" fill="#0284c7" fill-opacity="0.25"/>
      <text x="28" y="42" font-size="18">📦</text>
      <text x="64" y="40" fill="#f8fafc" font-size="15" font-weight="700">Digital Asset DAM</text>
      <text x="20" y="74" fill="#94a3b8" font-size="12" font-weight="400">
        <tspan x="20" dy="0">• Centralized Asset Vault</tspan>
        <tspan x="20" dy="18">• Dynamic Rights &amp; Access</tspan>
        <tspan x="20" dy="18">• AI Metadata Indexing</tspan>
      </text>
    </g>

    <!-- Card 2: Voice & Tone Linting -->
    <g class="pill-hover" transform="translate(245, 0)">
      <rect width="210" height="135" rx="14" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#card-glow)"/>
      <circle cx="36" cy="36" r="16" fill="#4f46e5" fill-opacity="0.25"/>
      <text x="28" y="42" font-size="18">✍️</text>
      <text x="64" y="40" fill="#f8fafc" font-size="15" font-weight="700">Voice &amp; Style Linters</text>
      <text x="20" y="74" fill="#94a3b8" font-size="12" font-weight="400">
        <tspan x="20" dy="0">• Prose Rules (Vale/LanguageTool)</tspan>
        <tspan x="20" dy="18">• Terminology Compliance</tspan>
        <tspan x="20" dy="18">• Automated CI/CD Gates</tspan>
      </text>
    </g>

    <!-- Card 3: Creative Review & Proofing -->
    <g class="pill-hover" transform="translate(490, 0)">
      <rect width="210" height="135" rx="14" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#card-glow)"/>
      <circle cx="36" cy="36" r="16" fill="#9333ea" fill-opacity="0.25"/>
      <text x="28" y="42" font-size="18">🎯</text>
      <text x="64" y="40" fill="#f8fafc" font-size="15" font-weight="700">Review &amp; Proofing</text>
      <text x="20" y="74" fill="#94a3b8" font-size="12" font-weight="400">
        <tspan x="20" dy="0">• Frame-Accurate Feedback</tspan>
        <tspan x="20" dy="18">• Locked Brand Templates</tspan>
        <tspan x="20" dy="18">• Multi-Stage Sign-Offs</tspan>
      </text>
    </g>

    <!-- Card 4: AI Context & Token Systems -->
    <g class="pill-hover" transform="translate(735, 0)">
      <rect width="210" height="135" rx="14" fill="url(#card-grad)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6" filter="url(#card-glow)"/>
      <circle cx="36" cy="36" r="16" fill="#db2777" fill-opacity="0.25"/>
      <text x="28" y="42" font-size="18">🤖</text>
      <text x="64" y="40" fill="#f8fafc" font-size="15" font-weight="700">AI Context &amp; Tokens</text>
      <text x="20" y="74" fill="#94a3b8" font-size="12" font-weight="400">
        <tspan x="20" dy="0">• Model Context Protocol (MCP)</tspan>
        <tspan x="20" dy="18">• Cross-Platform Tokens</tspan>
        <tspan x="20" dy="18">• Machine-Readable Rules</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(600, 395)">
    <circle cx="-160" cy="-2" r="3" fill="#38bdf8"/>
    <text x="-148" y="2" fill="#64748b" font-size="11" font-weight="600">SaaS &amp; Open-Source Directory</text>

    <circle cx="10" cy="-2" r="3" fill="#818cf8"/>
    <text x="22" y="2" fill="#64748b" font-size="11" font-weight="600">Agent-Ready Architecture</text>

    <circle cx="160" cy="-2" r="3" fill="#34d399"/>
    <text x="172" y="2" fill="#64748b" font-size="11" font-weight="600">Continuous Governance</text>
  </g>
</svg>