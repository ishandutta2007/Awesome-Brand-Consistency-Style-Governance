<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="420" viewBox="0 0 1200 420" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="glow-purple" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="glow-pink" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".25"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="scan-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".35" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity=".5"/></pattern><filter id="card-glow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.04)}}@keyframes floatReverse{0%{transform:translateY(0) scale(1)}50%{transform:translateY(14px) scale(.97)}}@keyframes pulseGlow{0%{opacity:.25}50%{opacity:.55}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes scanMotion{0%{transform:translateX(-1200px)}}.orb-1{animation:floatSlow 8s ease-in-out infinite}.orb-2{animation:floatReverse 10s ease-in-out infinite}.orb-3{animation:pulseGlow 6s ease-in-out infinite}.animated-scan{animation:scanMotion 7s linear infinite}.moving-flow{stroke-dasharray:6 6;animation:dashMove 3s linear infinite}.pill-hover{transition:transform .3s ease}.pill-hover:hover{transform:translateY(-4px)}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)"/><rect width="1200" height="420" fill="url(#grid)"/><g class="orb-1"><circle cx="180" cy="120" r="180" fill="url(#glow-cyan)"/></g><g class="orb-2"><circle cx="1020" cy="300" r="220" fill="url(#glow-purple)"/></g><g class="orb-3"><circle cx="600" cy="210" r="260" fill="url(#glow-pink)"/></g><g opacity=".4"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 100,100 C 300,40 500,160 700,90 S 1100,140 1150,110" class="moving-flow"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 50,340 C 250,380 450,290 750,360 S 1050,320 1150,350" class="moving-flow" style="animation-direction:reverse"/></g><g opacity=".6"><line x1="0" x2="1200" y1="2" y2="2" stroke="#334155" stroke-width="2"/><rect width="300" height="4" y="0" fill="url(#scan-grad)" class="animated-scan"/><line x1="0" x2="1200" y1="418" y2="418" stroke="#334155" stroke-width="2"/></g><g transform="translate(600, 52)"><rect width="290" height="32" x="-145" y="-16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" filter="url(#card-glow)" rx="16"/><circle cx="-122" cy="0" r="4.5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="-106" y="5" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE BRAND GOVERNANCE</text></g><g><text y="0" fill="url(#text-grad)" font-size="44" font-weight="900" letter-spacing="-1" text-anchor="middle" transform="translate(600, 126)">Brand Consistency &amp; Style Governance</text></g><g><text y="0" fill="#cbd5e1" font-size="18" font-weight="400" letter-spacing=".2" text-anchor="middle" transform="translate(600, 168)">Curated Standards, Modern DAM, Content Proofing &amp; AI Brand Governance</text></g><g><g class="pill-hover" transform="translate(130, 215) translate(0, 0)"><rect width="210" height="135" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" filter="url(#card-glow)" rx="14"/><circle cx="36" cy="36" r="16" fill="#0284c7" fill-opacity=".25"/><text x="28" y="42" font-size="18">📦</text><text x="64" y="40" fill="#f8fafc" font-size="15" font-weight="700">Digital Asset DAM</text><text x="20" y="74" fill="#94a3b8" font-size="12" font-weight="400"><tspan x="20" dy="0">• Centralized Asset Vault</tspan> <tspan x="20" dy="18">• Dynamic Rights &amp; Access</tspan> <tspan x="20" dy="18">• AI Metadata Indexing</tspan></text></g><g class="pill-hover" transform="translate(130, 215) translate(245, 0)"><rect width="210" height="135" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity=".6" stroke-width="1.2" filter="url(#card-glow)" rx="14"/><circle cx="36" cy="36" r="16" fill="#4f46e5" fill-opacity=".25"/><text x="28" y="42" font-size="18">✍️</text><text x="64" y="40" fill="#f8fafc" font-size="15" font-weight="700">Voice &amp; Style Linters</text><text x="20" y="74" fill="#94a3b8" font-size="12" font-weight="400"><tspan x="20" dy="0">• Prose Rules (Vale/LanguageTool)</tspan> <tspan x="20" dy="18">• Terminology Compliance</tspan> <tspan x="20" dy="18">• Automated CI/CD Gates</tspan></text></g><g class="pill-hover" transform="translate(130, 215) translate(490, 0)"><rect width="210" height="135" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity=".6" stroke-width="1.2" filter="url(#card-glow)" rx="14"/><circle cx="36" cy="36" r="16" fill="#9333ea" fill-opacity=".25"/><text x="28" y="42" font-size="18">🎯</text><text x="64" y="40" fill="#f8fafc" font-size="15" font-weight="700">Review &amp; Proofing</text><text x="20" y="74" fill="#94a3b8" font-size="12" font-weight="400"><tspan x="20" dy="0">• Frame-Accurate Feedback</tspan> <tspan x="20" dy="18">• Locked Brand Templates</tspan> <tspan x="20" dy="18">• Multi-Stage Sign-Offs</tspan></text></g><g class="pill-hover" transform="translate(130, 215) translate(735, 0)"><rect width="210" height="135" fill="url(#card-grad)" stroke="#f472b6" stroke-opacity=".6" stroke-width="1.2" filter="url(#card-glow)" rx="14"/><circle cx="36" cy="36" r="16" fill="#db2777" fill-opacity=".25"/><text x="28" y="42" font-size="18">🤖</text><text x="64" y="40" fill="#f8fafc" font-size="15" font-weight="700">AI Context &amp; Tokens</text><text x="20" y="74" fill="#94a3b8" font-size="12" font-weight="400"><tspan x="20" dy="0">• Model Context Protocol (MCP)</tspan> <tspan x="20" dy="18">• Cross-Platform Tokens</tspan> <tspan x="20" dy="18">• Machine-Readable Rules</tspan></text></g></g><g transform="translate(600, 395)"><circle cx="-160" cy="-2" r="3" fill="#38bdf8"/><text x="-148" y="2" fill="#64748b" font-size="11" font-weight="600">SaaS &amp; Open-Source Directory</text><circle cx="10" cy="-2" r="3" fill="#818cf8"/><text x="22" y="2" fill="#64748b" font-size="11" font-weight="600">Agent-Ready Architecture</text><circle cx="160" cy="-2" r="3" fill="#34d399"/><text x="172" y="2" fill="#64748b" font-size="11" font-weight="600">Continuous Governance</text></g></svg>